<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10140f">
<meta name="description" content="善鸡通搜索：关键词与语义混合检索。默认简体中文。"><title>善鸡通搜索 · Shanjitong Search</title>
<style>
:root{color-scheme:dark;--bg:#0b0f0b;--panel:#121912;--panel2:#19231a;--line:#28372a;--text:#eff8ed;--muted:#9cae9b;--lime:#b8f35a;--lime2:#8de33b;--yellow:#f4d35e;--danger:#ff9c83;--radius:22px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -20%,#283d1e 0,transparent 48%),var(--bg);font:16px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI","Noto Sans SC",sans-serif;color:var(--text);overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;background-image:radial-gradient(#b8f35a 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(to bottom,#000,transparent 78%);animation:drift 34s linear infinite;z-index:-1}
.aurora{position:fixed;inset:-30%;z-index:-2;pointer-events:none;filter:blur(80px);opacity:.18;background:conic-gradient(from 30deg,transparent,#4f842e,transparent,#b4d956,transparent);animation:aurora 24s ease-in-out infinite alternate}
@keyframes drift{to{background-position:84px 126px}}@keyframes aurora{0%{transform:rotate(0deg) scale(.9)}100%{transform:rotate(25deg) scale(1.12)}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #b8f35a22}50%{box-shadow:0 0 0 9px #b8f35a00}}@keyframes shimmer{to{background-position:-200% 0}}@keyframes enter{from{opacity:0;transform:translateY(15px) scale(.99);filter:blur(4px)}to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes glow{0%,100%{text-shadow:0 0 14px #b8f35a20}50%{text-shadow:0 0 28px #b8f35a65}}
.wrap{width:min(100% - 36px,1040px);margin:auto}.topbar{height:78px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff0d}.brand{display:flex;align-items:center;gap:11px;color:var(--text);text-decoration:none;font-weight:750;letter-spacing:.02em}.logo{width:39px;height:39px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(140deg,var(--lime),#e3f89d);color:#14200b;font-size:20px;box-shadow:0 0 25px #b8f35a22;animation:float 5s ease-in-out infinite}.brand small{display:block;color:var(--muted);font-weight:500;font-size:11px;letter-spacing:.12em}.top-actions{display:flex;gap:9px;align-items:center}.pill{border:1px solid var(--line);border-radius:999px;padding:7px 12px;background:#101710;color:var(--muted);font-size:12px}.status-dot{display:inline-block;width:7px;height:7px;background:var(--lime);border-radius:50%;margin-right:6px;box-shadow:0 0 10px var(--lime);animation:pulse 2.4s infinite}
.hero{text-align:center;padding:82px 0 38px;animation:enter .7s ease both}.eyebrow{display:inline-flex;align-items:center;gap:8px;color:var(--lime);border:1px solid #b8f35a36;background:#b8f35a0b;border-radius:999px;padding:6px 12px;font-size:12px;letter-spacing:.06em}.hero h1{font-size:clamp(42px,7vw,76px);line-height:1.08;letter-spacing:-.055em;margin:23px 0 17px;font-weight:850;animation:glow 5s ease-in-out infinite}.hero h1 span{color:var(--lime)}.hero p{color:var(--muted);max-width:580px;margin:0 auto;font-size:16px}.search-shell{margin:32px auto 0;max-width:760px;padding:7px;border:1px solid #b8f35a55;border-radius:19px;background:#111811cc;box-shadow:0 18px 70px #0007,0 0 40px #b8f35a0b;transition:border-color .25s,box-shadow .25s,transform .25s}.search-shell:focus-within{border-color:var(--lime);box-shadow:0 18px 70px #0008,0 0 0 4px #b8f35a14;transform:translateY(-2px)}.search-form{display:flex;gap:8px}.search-icon{width:48px;display:grid;place-items:center;color:var(--lime);font-size:23px}.search-form input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--text);font-size:16px;padding:13px 2px}.search-form input::placeholder{color:#788777}.search-form button{border:0;border-radius:13px;padding:0 24px;background:var(--lime);color:#16200e;font-weight:800;cursor:pointer;transition:transform .2s,background .2s;display:flex;align-items:center;gap:8px}.search-form button:hover{background:#d0ff81;transform:translateY(-1px)}.search-form button:active{transform:scale(.97)}.suggestions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:17px}.suggestions button{border:1px solid #ffffff15;background:#ffffff06;color:#a8b9a4;border-radius:999px;padding:6px 11px;font-size:12px;cursor:pointer;transition:all .2s}.suggestions button:hover{color:var(--lime);border-color:#b8f35a66;background:#b8f35a0b;transform:translateY(-2px)}
.meta-row{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--muted);font-size:12px;margin:38px 0 14px}.mode{border:1px solid var(--line);border-radius:999px;padding:5px 10px;color:#c4d3be}.results{display:grid;gap:12px;padding-bottom:60px}.result{border:1px solid var(--line);background:linear-gradient(120deg,#141c14ee,#101610e8);border-radius:17px;padding:19px 21px;transition:transform .22s,border-color .22s,background .22s;animation:enter .45s both;position:relative;overflow:hidden}.result:before{content:"";position:absolute;inset:0 auto 0 0;width:2px;background:var(--lime);transform:scaleY(0);transform-origin:bottom;transition:transform .25s}.result:hover{transform:translateY(-3px);border-color:#7b9e5d;background:#182219}.result:hover:before{transform:scaleY(1)}.result a{color:var(--lime);font-weight:750;text-decoration:none;font-size:18px}.result a:hover{text-decoration:underline;text-underline-offset:4px}.url{font-size:12px;color:#8bb46f;overflow-wrap:anywhere;margin:3px 0 9px}.snippet{color:#bdcbbb;font-size:14px;margin:0}.result-foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.tag{font-size:11px;border-radius:7px;background:#ffffff08;border:1px solid #ffffff0d;color:#9fb29a;padding:3px 7px}.empty,.error,.loading{border:1px dashed #354633;border-radius:18px;text-align:center;padding:36px 20px;color:var(--muted);background:#ffffff03}.empty-icon{font-size:30px;margin-bottom:6px;display:block;animation:float 4s infinite}.spinner{display:inline-block;width:21px;height:21px;border:2px solid #b8f35a33;border-top-color:var(--lime);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:8px}.skeleton{height:112px;border-radius:17px;background:linear-gradient(100deg,#141c14 25%,#233021 42%,#141c14 60%);background-size:200% 100%;animation:shimmer 1.3s infinite}.footer{border-top:1px solid #ffffff0d;padding:24px 0 34px;color:#738370;font-size:12px;display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}.footer strong{color:#a8bf9d;font-weight:600}.hidden{display:none!important}
@media(max-width:600px){.wrap{width:min(100% - 24px,1040px)}.topbar{height:66px}.top-actions .pill:first-child{display:none}.hero{padding:65px 0 28px}.hero p{font-size:14px}.search-form{gap:2px}.search-icon{width:34px}.search-form input{font-size:14px}.search-form button{padding:0 15px}.result{padding:16px}.result a{font-size:16px}.meta-row{align-items:flex-start;flex-direction:column;margin-top:28px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
</style></head>
<body><div class="aurora" aria-hidden="true"></div><header class="wrap topbar"><a class="brand" href="/" aria-label="善鸡通搜索首页"><span class="logo">善</span><span>善鸡通搜索<small>SHANJITONG SEARCH</small></span></a><div class="top-actions"><span class="pill"><i class="status-dot"></i>检索系统在线</span><span class="pill">简体中文</span></div></header>
<main class="wrap"><section class="hero"><div class="eyebrow"><span>✦</span> 关键词 × 语义混合检索</div><h1>发现知识的<span>另一面</span></h1><p>从网页中寻找答案。融合关键词匹配与语义理解，让每一次搜索都更贴近你的真实意图。</p>
<div class="search-shell"><form id="searchForm" class="search-form"><span class="search-icon" aria-hidden="true">⌕</span><input id="query" name="q" autocomplete="off" maxlength="300" placeholder="搜索网页、知识与灵感……" aria-label="输入搜索内容"><button type="submit"><span>开始搜索</span><span aria-hidden="true">↗</span></button></form></div>
<div class="suggestions" aria-label="热门搜索"><button type="button">人工智能</button><button type="button">开源软件</button><button type="button">网页开发</button><button type="button">科学与技术</button></div></section>
<section id="resultsSection" class="hidden" aria-live="polite"><div class="meta-row"><span id="resultSummary">搜索结果</span><span id="mode" class="mode">混合检索</span></div><div id="results" class="results"></div></section>
<section id="welcome" class="empty"><span class="empty-icon">✧</span><strong>从一个问题开始探索</strong><div style="font-size:13px;margin-top:5px">输入关键词，发现相关网页与内容</div></section></main>
<footer class="wrap footer"><span><strong>善鸡通搜索</strong> · 让信息更容易被发现</span><span>默认语言：简体中文 · 尊重网站抓取规则</span></footer>
<script>
const $=s=>document.querySelector(s);const form=$('#searchForm'),input=$('#query'),section=$('#resultsSection'),results=$('#results'),welcome=$('#welcome'),summary=$('#resultSummary'),mode=$('#mode');
function escapeHTML(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function safeUrl(v){try{const u=new URL(v);return ['http:','https:'].includes(u.protocol)?u.href:'#'}catch{return '#'}}
function showLoading(){welcome.classList.add('hidden');section.classList.remove('hidden');summary.textContent='正在搜索…';mode.textContent='正在检索';results.innerHTML='<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>'}
function render(data){const items=Array.isArray(data.results)?data.results:[];summary.textContent=`“${data.query||''}” · 找到 ${Number(data.total)||items.length} 条结果`;mode.textContent=({hybrid:'混合检索',keyword:'关键词检索','keyword-fallback':'关键词检索（语义服务暂不可用）',empty:'等待输入'})[data.mode]||'搜索结果';if(!items.length){results.innerHTML='<div class="empty"><span class="empty-icon">⌕</span><strong>暂时没有找到相关结果</strong><div style="font-size:13px;margin-top:5px">试试更短的关键词，或换一种表达方式。</div></div>';return}results.innerHTML=items.map((r,i)=>{const url=safeUrl(r.url||'');const title=escapeHTML(r.title||r.url||'未命名网页');const snippet=escapeHTML(r.snippet||r.description||'此页面暂时没有可展示的摘要。');let domain='';try{domain=new URL(url).hostname}catch{};return `<article class="result" style="animation-delay:${Math.min(i,8)*55}ms"><a href="${escapeHTML(url)}" target="_blank" rel="noopener noreferrer">${title}</a><div class="url">${escapeHTML(domain)}${r.url?' · '+escapeHTML(r.url):''}</div><p class="snippet">${snippet}</p><div class="result-foot"><span class="tag">${escapeHTML(r.language||'网页')}</span>${Number.isFinite(Number(r.quality))?`<span class="tag">内容质量 ${Math.round(Number(r.quality)*100)}%</span>`:''}${r.published_at?`<span class="tag">${escapeHTML(String(r.published_at).slice(0,10))}</span>`:''}</div></article>`}).join('')}
async function search(q){q=String(q||'').trim();if(!q){input.focus();return}input.value=q;showLoading();const params=new URLSearchParams({q,limit:'10'});try{const res=await fetch('/api/search?'+params.toString(),{headers:{'Accept':'application/json'}});if(!res.ok)throw new Error(res.status===429?'请求太频繁，请稍后再试。':'搜索服务暂时不可用，请稍后重试。');const data=await res.json();render(data)}catch(e){mode.textContent='连接异常';results.innerHTML=`<div class="error"><span class="empty-icon">⚠</span><strong>暂时无法完成搜索</strong><div style="font-size:13px;margin-top:5px">${escapeHTML(e.message||'请稍后重试')}</div></div>`}section.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'})}
form.addEventListener('submit',e=>{e.preventDefault();search(input.value)});document.querySelectorAll('.suggestions button').forEach(b=>b.addEventListener('click',()=>search(b.textContent)));const initial=new URLSearchParams(location.search).get('q');if(initial){search(initial)}
</script></body></html>

services:
  - type: web
    name: shanjitong-search-api
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: shanjitong-search-db
          property: connectionString
      - key: CRAWLER_USER_AGENT
        value: "ShanjitongBot/1.0 (+https://example.com/bot)"
      - key: ADMIN_TOKEN
        sync: false
  - type: worker
    name: shanjitong-search-crawler
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm run worker
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shanjitong-search-db
          property: connectionString
      - key: CRAWLER_USER_AGENT
        value: "ShanjitongBot/1.0 (+https://example.com/bot)"
      - key: ADMIN_TOKEN
        sync: false
      - key: CRAWL_INTERVAL_MS
        value: "1500"
databases:
  - name: shanjitong-search-db
    plan: starter
    databaseName: shanjitong_search
    user: shanjitong_search
